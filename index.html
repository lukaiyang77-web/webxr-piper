<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOR WebXR AR Debug</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #020617;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { margin: 0 0 10px 0; }
    .sub { color: var(--muted); margin-bottom: 18px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0b1220;
      color: var(--text);
      box-sizing: border-box;
    }
    .field {
      flex: 1 1 320px;
    }
    button {
      border: 1px solid #475569;
      background: var(--blue);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #1f2937;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #475569;
      background: #0b1220;
      font-size: 14px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mono {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 150px;
      max-height: 300px;
      overflow: auto;
    }
    #xrCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="xrCanvas"></canvas>

  <div class="wrap">
    <h1>YOR WebXR AR Debug</h1>
    <div class="sub">Minimal page for Quest passthrough AR + bridge debug</div>

    <div class="card">
      <div class="row">
        <div class="field">
          <label for="bridgeUrl">Bridge URL</label>
          <input id="bridgeUrl" value="wss://beverage-procedure-clothing-mug.trycloudflare.com" />
        </div>
      </div>
      <div class="row">
        <button id="connectBtn">Connect Bridge</button>
        <button id="enterArBtn">Enter AR</button>
        <button id="exitArBtn" class="secondary">Exit AR</button>
        <div id="bridgeStatus" class="status"><span class="dot"></span><span>Bridge disconnected</span></div>
        <div id="xrStatus" class="status"><span class="dot"></span><span>XR idle</span></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <label>Logs</label>
        <div id="logs" class="mono"></div>
      </div>
      <div class="card">
        <label>XR raw debug</label>
        <div id="raw" class="mono"></div>
      </div>
      <div class="card">
        <label>Left controller</label>
        <div id="left" class="mono"></div>
      </div>
      <div class="card">
        <label>Right controller</label>
        <div id="right" class="mono"></div>
      </div>
    </div>
  </div>

  <script>
    const logsEl = document.getElementById('logs');
    const rawEl = document.getElementById('raw');
    const leftEl = document.getElementById('left');
    const rightEl = document.getElementById('right');
    const bridgeUrlEl = document.getElementById('bridgeUrl');
    const connectBtn = document.getElementById('connectBtn');
    const enterArBtn = document.getElementById('enterArBtn');
    const exitArBtn = document.getElementById('exitArBtn');
    const bridgeStatusEl = document.getElementById('bridgeStatus');
    const xrStatusEl = document.getElementById('xrStatus');
    const xrCanvas = document.getElementById('xrCanvas');

    let ws = null;
    let xrSession = null;
    let xrRefSpace = null;
    let gl = null;

    function log(msg) {
      const line = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logsEl.textContent += line + '\n';
      logsEl.scrollTop = logsEl.scrollHeight;
      console.log(msg);
    }

    function setStatus(el, text, state) {
      const dot = el.querySelector('.dot');
      const label = el.querySelector('span:last-child');
      dot.classList.remove('ok', 'err');
      if (state === 'ok') dot.classList.add('ok');
      if (state === 'err') dot.classList.add('err');
      label.textContent = text;
    }

    window.onerror = function(message, source, lineno) {
      log('window.onerror: ' + message + ' @ ' + source + ':' + lineno);
    };

    window.onunhandledrejection = function(event) {
      const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
      log('unhandledrejection: ' + reason);
    };

    function makeEmptyLeft() {
      return {
        x: false,
        y: false,
        menu: false,
        thumbstick: false,
        index_trigger: 0,
        hand_trigger: 0,
        thumbstick_axes: [0, 0],
        local_position: [0, 0, 0],
        local_rotation: [0, 0, 0, 1]
      };
    }

    function makeEmptyRight() {
      return {
        a: false,
        b: false,
        menu: false,
        thumbstick: false,
        index_trigger: 0,
        hand_trigger: 0,
        thumbstick_axes: [0, 0],
        local_position: [0, 0, 0],
        local_rotation: [0, 0, 0, 1]
      };
    }

    function num(v, d) {
      const x = Number(v);
      return Number.isFinite(x) ? x : d;
    }

    function sendState(left, right) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ left, right }));
    }

    function connectBridge() {
      const url = bridgeUrlEl.value.trim();
      log('connectBridge() url=' + url);
      if (!url) {
        log('Bridge URL empty');
        return;
      }
      try {
        ws = new WebSocket(url);
      } catch (e) {
        log('WebSocket constructor failed: ' + e.message);
        return;
      }
      setStatus(bridgeStatusEl, 'Bridge connecting...', '');
      ws.onopen = function() {
        setStatus(bridgeStatusEl, 'Bridge connected', 'ok');
        log('Bridge connected');
      };
      ws.onclose = function(e) {
        setStatus(bridgeStatusEl, 'Bridge disconnected', 'err');
        log('Bridge closed code=' + e.code + ' reason=' + (e.reason || '(none)'));
      };
      ws.onerror = function() {
        setStatus(bridgeStatusEl, 'Bridge error', 'err');
        log('Bridge websocket error');
      };
      ws.onmessage = function(e) {
        log('Bridge says: ' + e.data);
      };
    }

    async function enterAR() {
      log('enterAR() called');
      if (!navigator.xr) {
        log('navigator.xr missing');
        setStatus(xrStatusEl, 'XR unsupported', 'err');
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      log('immersive-ar supported=' + supported);
      if (!supported) {
        setStatus(xrStatusEl, 'AR unsupported', 'err');
        return;
      }

      xrSession = await navigator.xr.requestSession('immersive-ar', {
        optionalFeatures: ['local-floor', 'local', 'bounded-floor', 'hand-tracking', 'plane-detection']
      });

      gl = xrCanvas.getContext('webgl', {
        xrCompatible: true,
        alpha: true,
        premultipliedAlpha: false,
        antialias: true
      });

      if (!gl) {
        log('Failed to create WebGL context');
        setStatus(xrStatusEl, 'WebGL failed', 'err');
        await xrSession.end();
        return;
      }

      await gl.makeXRCompatible();

      xrSession.updateRenderState({
        baseLayer: new XRWebGLLayer(xrSession, gl)
      });

      xrRefSpace = await xrSession.requestReferenceSpace('local-floor').catch(() => null);
      if (!xrRefSpace) {
        xrRefSpace = await xrSession.requestReferenceSpace('local');
      }

      setStatus(xrStatusEl, 'AR running', 'ok');
      log('AR session started');

      xrSession.addEventListener('end', function() {
        xrSession = null;
        xrRefSpace = null;
        setStatus(xrStatusEl, 'XR idle', '');
        log('AR session ended');
      });

      function onXRFrame(t, frame) {
        if (!xrSession) return;
        xrSession.requestAnimationFrame(onXRFrame);

        const pose = frame.getViewerPose(xrRefSpace);
        if (!pose) return;

        const left = makeEmptyLeft();
        const right = makeEmptyRight();
        const lines = [];
        lines.push('inputSources=' + xrSession.inputSources.length);

        const baseLayer = xrSession.renderState.baseLayer;
        gl.bindFramebuffer(gl.FRAMEBUFFER, baseLayer.framebuffer);

        for (const view of pose.views) {
          const viewport = baseLayer.getViewport(view);
          gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        }

        for (const inputSource of xrSession.inputSources) {
          const hand = inputSource.handedness || 'unknown';
          const profiles = (inputSource.profiles || []).join(',');
          const hasGamepad = !!inputSource.gamepad;
          lines.push('- hand=' + hand + ' profiles=[' + profiles + '] gamepad=' + hasGamepad);

          let poseData = null;
          try {
            poseData = frame.getPose(inputSource.gripSpace || inputSource.targetRaySpace, xrRefSpace);
          } catch (e) {}

          const target = hand === 'left' ? left : hand === 'right' ? right : null;
          if (!target) continue;

          if (poseData) {
            const px = poseData.transform.position.x;
            const py = poseData.transform.position.y;
            const pz = poseData.transform.position.z;

            // Axis mapping only: keep rotation unchanged
            // robot_x = -webxr_z
            // robot_y = -webxr_x
            // robot_z =  webxr_y
            target.local_position = [-pz, -px, py];
            target.local_rotation = [
              poseData.transform.orientation.x,
              poseData.transform.orientation.y,
              poseData.transform.orientation.z,
              poseData.transform.orientation.w
            ];
          }

          if (inputSource.gamepad) {
            const gp = inputSource.gamepad;
            const axes = Array.from(gp.axes || []).map(v => num(v, 0));
            const buttons = Array.from(gp.buttons || []).map((b, i) => ({
              i: i,
              pressed: !!b.pressed,
              value: num(b.value, 0)
            }));
            lines.push('  ' + hand + '.axes=' + JSON.stringify(axes));
            lines.push('  ' + hand + '.buttons=' + JSON.stringify(buttons));

            target.index_trigger = num(gp.buttons[0] && gp.buttons[0].value, 0);
            target.hand_trigger = num(gp.buttons[1] && gp.buttons[1].value, 0);
            target.thumbstick_axes = [num((axes.length >= 4 ? axes[2] : axes[0]), 0), num((axes.length >= 4 ? axes[3] : axes[1]), 0)];
            target.thumbstick = !!(gp.buttons[3] && gp.buttons[3].pressed);

            if (hand === 'left') {
              target.x = !!(gp.buttons[4] && gp.buttons[4].pressed);
              target.y = !!(gp.buttons[5] && gp.buttons[5].pressed);
              target.menu = !!(gp.buttons[6] && gp.buttons[6].pressed);
            }
            if (hand === 'right') {
              target.a = !!(gp.buttons[4] && gp.buttons[4].pressed);
              target.b = !!(gp.buttons[5] && gp.buttons[5].pressed);
              target.menu = !!(gp.buttons[6] && gp.buttons[6].pressed);
            }
          }
        }

        rawEl.textContent = lines.join('\n');
        leftEl.textContent = JSON.stringify(left, null, 2);
        rightEl.textContent = JSON.stringify(right, null, 2);
        sendState(left, right);
      }

      xrSession.requestAnimationFrame(onXRFrame);
    }

    async function exitAR() {
      log('exitAR() called');
      if (xrSession) {
        await xrSession.end();
      }
    }

    connectBtn.addEventListener('click', function() {
      log('Connect Bridge button clicked');
      connectBridge();
    });

    enterArBtn.addEventListener('click', function() {
      log('Enter AR button clicked');
      enterAR().catch(function(e) {
        log('enterAR failed: ' + e.message);
        console.error(e);
      });
    });

    exitArBtn.addEventListener('click', function() {
      log('Exit AR button clicked');
      exitAR().catch(function(e) {
        log('exitAR failed: ' + e.message);
        console.error(e);
      });
    });

    log('page loaded: protocol=' + location.protocol + ' host=' + location.host);
    log('default bridge url=' + bridgeUrlEl.value);
  </script>
</body>
</html>
